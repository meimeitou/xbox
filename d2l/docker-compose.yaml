services:
  jupyterlab:
    image: quay.io/jupyter/scipy-notebook:2025-08-04
    container_name: jupyterlab
    ports:
      - "8888:8888"
    volumes:
      - ./:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - DOCKER_STACKS_JUPYTER_CMD=lab
      # 是否自动生成证书
      - GEN_CERT=yes
    # pw: admin
    command: |
      start-notebook.py --ServerApp.base_url=/
      --ServerApp.password='argon2:$argon2id$v=19$m=10240,t=10,p=8$3/9UgtjFysaSkaZ7Zzmryw$K1nrBSMWztukex2+C+axtEdBJuHoTlHUEkldbXIdQGc'
    restart: unless-stopped
